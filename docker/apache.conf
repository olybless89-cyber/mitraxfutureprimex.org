<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Never expose app internals (site root is the project root, cPanel-style)
    <LocationMatch "^/(\.|vendor|app|bootstrap|config|database|routes|tests|resources/views|docker)(/|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "^/storage/(?!app/public/)">
        Require all denied
    </LocationMatch>
    <FilesMatch "(^\.|\.(sql|log|env|lock|md|xml|yml|sh)$|^(artisan|composer\.json|package(-lock)?\.json|Dockerfile|railway\.json|error_log|symlink\.php|server\.php)$)">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
